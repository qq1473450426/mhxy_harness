# 梦幻西游 PC 端本地 AI 自动任务系统
system:
  max_accounts: 5
  language: zh-CN
  project_name: mhxy_local_ai

automation:
  auto_start: false
  max_retry: 3
  action_timeout: 10
  state_timeout: 30
  tick_seconds: 0.5

vision:
  fps: 10
  capture_backend: mss
  ocr_backend: rapidocr
  template_threshold: 0.85
  # 游戏窗口约 812x663 时：右侧任务追踪 + 中下部 NPC 对话。
  # 使用归一化坐标，自动适配窗口尺寸；左侧聊天区不再进入常规 OCR。
  ocr_regions:
    - [0.68, 0.14, 0.32, 0.40]
    - [0.05, 0.48, 0.90, 0.38]

input:
  backend: win32
  failsafe: true
  move_duration: 0.08

llm:
  provider: ollama
  model: qwen2.5:7b
  base_url: http://127.0.0.1:11434
  temperature: 0.2
  max_tokens: 512

embedding:
  model: bge-m3
knowledge:
  repo: D:/project/python/mhxy_ai/xyq-skills
  vector_db: numpy

ui:
  host: 127.0.0.1
  port: 8080

logging:
  level: INFO
  console: true
  max_bytes: 5242880
  backup_count: 3

accounts:
  leader: account_01
  list:
    - id: account_01
      role: leader
      enabled: true
      window_title: "梦幻西游 ONLINE"
    - id: account_02
      role: follower
      enabled: false
      window_title: "梦幻西游 ONLINE"
    - id: account_03
      role: follower
      enabled: false
      window_title: "梦幻西游 ONLINE"
    - id: account_04
      role: follower
      enabled: false
      window_title: "梦幻西游 ONLINE"
    - id: account_05
      role: follower
      enabled: false
      window_title: "梦幻西游 ONLINE"
